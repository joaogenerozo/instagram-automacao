name: Preparar semana

on:
  schedule:
    - cron: "0 13 * * 6"   # sábado, 10:00 de Brasília
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Relatório de desempenho da semana (dados reais)
        continue-on-error: true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python tools/relatorio.py
      - name: Gerar conteúdo e imagens da próxima semana
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python semanal.py
      - name: Enviar para o repositório
        run: |
          git config user.name "robo-instagram"
          git config user.email "actions@users.noreply.github.com"
          git add conteudo midia fila.json GNZ01-MARKETING/RELATORIOS
          git diff --cached --quiet || (git commit -m "Agenda posts da próxima semana" && git pull --rebase && git push)
      - name: Avisar o dono se algo foi pulado ou falhou
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s alerta.txt ]; then
            gh issue create --title "Instagram: aviso da automação ($(date -u '+%d/%m %H:%M') UTC)" --body-file alerta.txt || cat alerta.txt
          fi
